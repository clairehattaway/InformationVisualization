<script>
function syncMap() {
    var dateElements = document.querySelectorAll('.timecontrol-date, .leaflet-control-timecontrol');
    dateElements.forEach(function(el) {
        if (el.innerHTML.match(/[23]\d{3}/)) {
            el.innerHTML = el.innerHTML.replace(/[23]\d{3}/, function(year) {
                return parseInt(year) - 2000;
            });
        }
    });

    var labels = document.querySelectorAll('.leaflet-control-layers-overlays label');
    var isVisible = true;
    
    labels.forEach(function(label) {
        if (label.innerHTML.includes('Trading Milestones')) {
            var checkbox = label.querySelector('input');
            isVisible = checkbox.checked;
        }
    });

    var slider = document.querySelector('.leaflet-control-timecontrol');
    var leaves = document.querySelectorAll('.leaflet-marker-icon');
    
    if (slider) {
        slider.style.display = isVisible ? 'block' : 'none';
    }
    leaves.forEach(function(leaf) {
        // Target only the icons from the animation layer (API icons)
        if (leaf.src && leaf.src.includes('leaf')) {
            leaf.style.opacity = isVisible ? '1' : '0';
            leaf.style.pointerEvents = isVisible ? 'auto' : 'none';
        }
    });
}

setInterval(syncMap, 50);
</script>
